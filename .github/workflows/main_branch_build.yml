name: Main Branch Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 12,0 * * *'

permissions:
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build
      run: cd build && build.bat
      shell: cmd

    - name: Upload artifact KneeSurgery_net6.0
      uses: actions/upload-artifact@v4
      with:
        name: KneeSurgery_net6.0
        path: out/KneeSurgery_net6.0

    - name: Upload artifact KneeSurgery_net7.0
      uses: actions/upload-artifact@v4
      with:
        name: KneeSurgery_net7.0
        path: out/KneeSurgery_net7.0

    - name: Upload artifact KneeSurgery_net8.0
      uses: actions/upload-artifact@v4
      with:
        name: KneeSurgery_net8.0
        path: out/KneeSurgery_net8.0

    - name: Upload artifact KneeSurgery_net9.0
      uses: actions/upload-artifact@v4
      with:
        name: KneeSurgery_net9.0
        path: out/KneeSurgery_net9.0

    - name: Upload artifact KneeSurgery_net10.0
      uses: actions/upload-artifact@v4
      with:
        name: KneeSurgery_net10.0
        path: out/KneeSurgery_net10.0